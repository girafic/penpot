<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WASM + WebGL2 Canvas</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      position: absolute;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module">
    import initWasmModule from '/js/render-wasm.js';
    import {
      init, addShapeSolidFill, assignCanvas, hexToU32ARGB, useShape,
      setShapeChildren, setupInteraction, draw_star, allocBytes, getHeapU32
    } from './js/lib.js';

    const canvas = document.getElementById("canvas");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Glass values can be tuned from the URL, e.g.
    // glass.html?angle=-45&intensity=80&refraction=80&depth=20&dispersion=50
    //   &frost=4&splay=0&saturation=100&brightness=100&highlight=2
    //   &texture=reeded&textureAmount=30&textureScale=8&textureAngle=0&light=ffffff
    const params = new URLSearchParams(document.location.search);
    const value = (name, fallback) => Number(params.get(name) ?? fallback);
    const glassFloats = [
      value("angle", -45),
      value("intensity", 80),
      value("refraction", 80),
      value("depth", 20),
      value("dispersion", 50),
      value("frost", 4),
      value("splay", 0),
      value("saturation", 100),
      value("brightness", 100),
      value("highlight", 2),
      value("textureAmount", 30),
      value("textureScale", 8),
      value("textureAngle", 0),
    ];
    const texture = params.get("texture") === "reeded" ? 1 : 0;
    const lightColor = hexToU32ARGB("#" + (params.get("light") ?? "ffffff"), 1);

    // 60-byte glass buffer, see render-wasm/docs/serialization.md
    function setShapeGlass(Module) {
      const ptr = allocBytes(60);
      const dv = new DataView(getHeapU32().buffer);
      dv.setUint8(ptr, 0);
      dv.setUint8(ptr + 1, texture);
      glassFloats.forEach((v, i) => dv.setFloat32(ptr + 4 + i * 4, v, true));
      dv.setUint32(ptr + 56, lightColor, true);
      Module._set_shape_glass();
    }

    const RECT = 3;
    const PATH = 4;
    const CIRCLE = 6;

    initWasmModule().then(Module => {
      init(Module);
      assignCanvas(canvas);
      Module._set_canvas_background(hexToU32ARGB("#FFFFFF", 1));
      Module._init_shapes_pool(200);
      setupInteraction(canvas);

      const children = [];
      const addShape = (type, x, y, width, height) => {
        const uuid = crypto.randomUUID();
        children.push(uuid);
        useShape(uuid);
        Module._set_parent(0, 0, 0, 0);
        Module._set_shape_type(type);
        Module._set_shape_selrect(x, y, x + width, y + height);
        return uuid;
      };

      // Backdrop: colored stripes and thin lines.
      const colors = ["#FF5050", "#28A0FF", "#141414", "#FFC800"];
      for (let i = 0; i * 24 < canvas.width; i++) {
        addShape(RECT, i * 24, 0, 10, canvas.height);
        addShapeSolidFill(hexToU32ARGB(colors[i % colors.length], 1));
      }
      for (let j = 0; j * 40 < canvas.height; j++) {
        addShape(RECT, 0, j * 40, canvas.width, 3);
        addShapeSolidFill(hexToU32ARGB("#1E1E1E", 1));
      }

      const withGlass = () => {
        addShapeSolidFill(hexToU32ARGB("#D9D9D9", 0.2));
        setShapeGlass(Module);
      };

      addShape(RECT, 80, 80, 240, 240);
      Module._set_shape_corners(48, 48, 48, 48);
      withGlass();

      addShape(RECT, 380, 80, 160, 150);
      withGlass();

      addShape(CIRCLE, 600, 80, 260, 260);
      withGlass();

      addShape(PATH, 920, 60, 280, 280);
      draw_star(920, 60, 280, 280);
      withGlass();

      useShape("00000000-0000-0000-0000-000000000000");
      setShapeChildren(children);

      Module._set_view(1, 0, 0);
      Module._render(Date.now());
    });
  </script>
</body>
</html>
